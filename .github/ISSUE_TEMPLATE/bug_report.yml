name: Bug report
description: Something in KZ Companion (the Windows app or the Android app) does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste or upload credentials, pairing keys, QR codes, API keys or tokens**,
        in the text, the logs or the screenshots. Blur them first.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Apps page on the phone
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KZ Companion version
      description: Right-click the tray icon on the PC; the menu shows it.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device model
      placeholder: Pixel 6, Android 14
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant logs
      description: Lines from `%LocalAppData%\DroidDeck.log` (the file name predates the rename). Remove anything private.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Blur anything private.
