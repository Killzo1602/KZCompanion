name: Feature request
description: Suggest an improvement. v1.0.0 is in feature freeze, so requests are planned for after the release.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please **do not include credentials, pairing keys or tokens**.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow, and why it matters.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Screens, apps or services it should work with.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows version and Android version/device this is about.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to help build this.
