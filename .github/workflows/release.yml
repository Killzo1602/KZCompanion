name: Release

# Manual only: Actions -> Release -> Run workflow, with the version to publish (for example 1.0.0).
#
# Safety rules enforced here:
#   * the tag v<version> must not exist yet, and docs/release-notes/v<version>.md must exist;
#   * the Android release keystore secrets must exist; a build that would be debug-signed fails;
#   * the Windows front-end is rebuilt from source and compared byte for byte with what the installer contains;
#   * the release is created as a DRAFT, the annotated tag is pushed, and only then is it published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  EXPECTED_CERT_SHA256: '91:BC:7B:45:F7:21:2A:ED:01:4C:AE:52:8B:4A:A9:A8:B6:89:C4:B6:5E:BC:B1:1D:49:09:13:B1:D6:D8:62:AF'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version, tag and release notes
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.0.0"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::tag v$VERSION already exists"; exit 1; fi
          [ -f "docs/release-notes/v$VERSION.md" ] || { echo "::error::docs/release-notes/v$VERSION.md is missing"; exit 1; }
          grep -q "^version: $VERSION+" app/pubspec.yaml || { echo "::error::app/pubspec.yaml version is not $VERSION"; exit 1; }

      - name: Check Android signing secrets exist
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          B: ${{ secrets.ANDROID_KEY_ALIAS }}
          C: ${{ secrets.ANDROID_KEY_PASSWORD }}
          D: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for n in A B C D; do
            [ -n "${!n}" ] || { echo "::error::an ANDROID_* signing secret is missing. Run scripts/new-android-keystore.ps1 (see docs/android-signing.md)."; exit 1; }
          done

  windows:
    name: Windows installer
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'   # pinned: the version the release was verified with (newer stable needs Gradle 9)
          channel: stable
          cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Backend tests (a release never ships with a failing test)
        run: dotnet test DroidDeck.sln -c Release --filter "Category!=RequiresDesktop"

      # Fresh web build, clean wwwroot, legacy-UI and byte-identity checks, licenses copied in.
      - name: Publish (verified)
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Out publish -Version $env:VERSION

      - name: Installer (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          ./scripts/build-installer.ps1 -PublishDir publish -Version $env:VERSION -OutDir installer

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: installer/*

  android:
    name: Android APK (arm64)
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      KZ_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'   # pinned: the version the release was verified with (newer stable needs Gradle 9)
          channel: stable
          cache: true

      - name: Restore release keystore
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Verify signature, package, version and ABI
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "KZCompanion-Android-arm64-v$VERSION.apk"
          # EXPECTED_CERT_SHA256 is the public SHA-256 fingerprint of the release certificate.
          bash scripts/verify-apk.sh "KZCompanion-Android-arm64-v$VERSION.apk" "$VERSION" dev.kzstudio.kzcompanion "$EXPECTED_CERT_SHA256"

      - name: Remove signing material
        if: always()
        run: rm -f app/android/key.properties app/android/app/release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: KZCompanion-Android-arm64-v*.apk

  release:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: assets

      - uses: actions/download-artifact@v8
        with:
          name: android
          path: assets

      - name: Checksums and notes
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md assets/
          cd assets
          sha256sum "KZCompanion-Setup-$VERSION.exe" "KZCompanion-Android-arm64-v$VERSION.apk" > SHA256SUMS.txt
          cd ..
          { cat "docs/release-notes/v$VERSION.md"
            printf '\n## SHA-256 checksums\n\n```\n'; cat assets/SHA256SUMS.txt; printf '```\n'; } > notes.md

      # Draft first, so nothing is public until the tag and every asset exist.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --title "KZ Companion v$VERSION" --notes-file notes.md assets/*
          n=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          echo "assets uploaded: $n"
          gh release view "v$VERSION" --json assets --jq '.assets[].name'
          for f in "KZCompanion-Setup-$VERSION.exe" "KZCompanion-Android-arm64-v$VERSION.apk" SHA256SUMS.txt; do
            gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "::error::$f was not uploaded"; exit 1; }
          done

      - name: Annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "KZ Companion v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --latest
