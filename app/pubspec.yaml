name: droiddeck
description: KZ Companion - painel de controle do PC Windows (KZ Dev Studio), baseado no DroidDeck.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1
  signals_flutter: ^4.4.0
  flutter_getit: ^2.0.0
  asyncstate: ^2.1.1-dev.1
  loading_animation_widget: ^1.2.0+4
  shared_preferences: ^2.0.18

  json_annotation: ^4.8.1
  network_info_plus: ^7.0.0
  image_picker: ^1.2.1
  signalr_netcore: ^1.4.4
  mobile_scanner: ^7.2.0
  collection: ^1.19.1
  logging: ^1.3.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  web: ^1.1.1
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  get_it: ^7.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
