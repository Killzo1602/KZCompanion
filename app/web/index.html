<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KZ Companion — o seu companheiro para o PC.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D0D0F">
  <meta name="apple-mobile-web-app-title" content="KZ Companion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KZ Companion</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { background: #0D0D0F; margin: 0; }</style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      }
    }
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      var build = '__WEB_BUILD__';
      var base = build.charAt(0) === '_' ? '' : 'v/' + build + '/';
      _flutter.loader.loadEntrypoint({
        entrypointUrl: base + 'main.dart.js',
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({ assetBase: base }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
